version: "3.9"

services:
  bot:
    build: .
    container_name: njb-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TM_API_KEY=${TM_API_KEY:-}
      - MHDDOS_PATH=start.py
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./files:/app/files
    stdin_open: true
    tty: true
    stop_grace_period: 15s